<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMC Sierra AT4X — V8 Performance Archive</title>
  <meta name="description" content="A bespoke luxury automotive portal featuring custom V8 modified trucks.">
  <link rel="stylesheet" href="styles.css?v=v8-showcase-v1">
</head>
<body class="editorial-white-body" data-car-page="sierra">

  <!-- Editorial 2-Column Showcase Canvas (Text Left, Car Frontal Right) -->
  <main class="white-showcase-stage">
    <div class="white-showcase-grid">
      <!-- Left Column: Typography, Specs & Interactive Controls -->
      <div class="showcase-text-col">
        <!-- Desktop Top Back Link -->
        <div class="showcase-top-nav-row">
          <a href="index.html?car=sierra" class="btn-showcase-back-top" title="Return to All Machines">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>All Machines</span>
          </a>
        </div>

        <div class="showcase-badge-row">
          <div class="showcase-brand-badge">
            <img src="assets/icons/gmc.svg" alt="GMC" width="48" height="28">
            <span>GMC Trucks • UAE Bespoke Luxury Commission</span>
          </div>
        </div>

        <h1 class="showcase-title">
          Sierra AT4X
        </h1>

        <p class="showcase-tagline">
          6.2L EcoTec3 V8 • <span class="tag-accent">420 HP</span> • Multimatic DSSV Spool Dampers
        </p>

        <!-- Benchmark Performance Specs -->
        <div class="showcase-specs-grid">
          <div class="showcase-spec-item">
            <div class="showcase-spec-val">420 <span class="showcase-spec-unit">HP</span></div>
            <div class="showcase-spec-lbl">EcoTec3 V8</div>
          </div>
          <div class="showcase-spec-item">
            <div class="showcase-spec-val">5.6 <span class="showcase-spec-unit">s</span></div>
            <div class="showcase-spec-lbl">0-100 Launch</div>
          </div>
          <div class="showcase-spec-item">
            <div class="showcase-spec-val">624 <span class="showcase-spec-unit">Nm</span></div>
            <div class="showcase-spec-lbl">V8 Torque</div>
          </div>
          <div class="showcase-spec-item">
            <div class="showcase-spec-val">92 <span class="showcase-spec-unit">dB</span></div>
            <div class="showcase-spec-lbl">Sport Active Exhaust</div>
          </div>
          <div class="showcase-spec-item">
            <div class="showcase-spec-val">410K <span class="showcase-spec-unit">AED</span></div>
            <div class="showcase-spec-lbl">Commission Base</div>
          </div>
        </div>

        <!-- Action Controls -->
        <div class="showcase-action-row">
          <button class="btn-showcase-ignite" id="btnHeroIgnite" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="10 8 16 12 10 16 10 8"/>
            </svg>
            <span id="heroIgniteText">Ignite V8 Roar</span>
          </button>

          <button class="btn-showcase-keyfob" id="btnHeroKeys" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            </svg>
            <span>Digital Keyfob</span>
          </button>
        </div>
      </div>

      <!-- Right Column: Bespoke Car Frontal Stance -->
      <div class="showcase-image-col">
        <div class="showcase-car-wrapper">
          <img 
            src="assets/images/sierra-front.jpg" 
            alt="GMC Sierra AT4X Bespoke Edition Frontal View" 
            class="showcase-car-img"
            width="704"
            height="540"
            loading="eager"
          >
        </div>
      </div>
    </div>
  </main>

  <script src="script.js?v=v8-showcase-v1"></script>
</body>
</html>
